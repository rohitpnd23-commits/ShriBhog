<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShriBhog - Customer Menu</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "PASTE_YOUR_API_KEY",
  authDomain: "PASTE_YOUR_AUTH_DOMAIN",
  projectId: "PASTE_YOUR_PROJECT_ID",
  storageBucket: "PASTE_YOUR_STORAGE_BUCKET",
  messagingSenderId: "PASTE_YOUR_SENDER_ID",
  appId: "PASTE_YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const q = query(collection(db, "dishes"), where("status", "==", "approved"));
onSnapshot(q, (snap)=>{
  const list=document.getElementById('menu');
  list.innerHTML='';
  if(snap.empty){ list.innerHTML='<p>Abhi koi dish approve nahi hua hai</p>'; return; }
  snap.forEach(doc=>{
    const d=doc.data();
    list.innerHTML+=`
      <div style="border:1px solid #ddd;border-radius:12px;padding:10px;margin:10px;background:white;text-align:center;width:160px">
        ${d.img?`<img src="${d.img}" style="width:140px;height:100px;object-fit:cover;border-radius:8px">`:`<div style="width:140px;height:100px;background:#eee;line-height:100px">No Photo</div>`}
        <h4 style="margin:8px 0 2px">${d.name}</h4>
        <p style="margin:0;color:green;font-weight:bold">₹${d.price}</p>
        <button style="background:#ff6a00;color:white;border:none;padding:6px 10px;border-radius:6px;margin-top:6px;width:100%">Order Now</button>
      </div>`;
  });
});
</script>
<style>
body{font-family:sans-serif;background:#fff8f0;margin:0}
.header{background:#ff6a00;color:white;padding:15px;text-align:center;font-size:20px;font-weight:bold}
#menu{display:flex;flex-wrap:wrap;justify-content:center;padding:10px}
</style>
</head>
<body>
<div class="header">🍛 ShriBhog - Jora Mandir<br><small style="font-size:12px">Fresh Food - Fast Delivery</small></div>
<div id="menu"><p style="text-align:center;width:100%">Loading menu...</p></div>
</body>
</html>
