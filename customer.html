<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Shri Bhog</title><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}body{background:#fff8f0;padding-bottom:220px}.header{background:#b91c1c;color:#fff;padding:18px;text-align:center;position:sticky;top:0;z-index:10}.loginBox{background:#fff;margin:12px;padding:14px;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.08);border:1px solid #fee2e2}.menu{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#fff;border-radius:16px;padding:12px;box-shadow:0 4px 12px rgba(0,0,0,.1);border:1px solid #fee2e2}.card img{width:100%;height:115px;object-fit:cover;border-radius:12px}.card h3{margin:8px 0 4px;font-size:15px}.card p{color:#b91c1c;font-weight:700}.card button{background:#b91c1c;color:#fff;border:none;width:100%;padding:8px;border-radius:8px;margin-top:6px;font-weight:600}.cart{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid #b91c1c;padding:12px;max-height:82vh;overflow:auto;border-radius:20px 20px 0 0}.input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0}.btn-main{background:#b91c1c;color:#fff;border:none;width:100%;padding:14px;border-radius:12px;font-weight:700;font-size:16px;margin-top:8px}.btn-loc{background:#fff;border:1.5px dashed #b91c1c;color:#b91c1c;width:100%;padding:10px;border-radius:10px;font-weight:600}</style></head><body><div class="header"><h1>🙏 Shri Bhog</h1><p style="font-size:13px">Shuddh • Satvik • Ghar Jaisa - UPI: rohitpnd23-6@okaxis <a href="admin.html" style="color:#fff;float:right;font-size:11px">Admin→</a></p></div><div class="loginBox" id="loginBox"><h4>👤 Customer Login</h4><input id="lName" class="input" placeholder="Naam *"><input id="lPhone" class="input" placeholder="Mobile 10 digit *" type="tel"><button class="btn-main" style="padding:10px" onclick="doLogin()">Login Karke Menu Dekho</button></div><div class="menu" id="menu"></div><div class="cart" id="cartBox"><h3>🛒 Order <span id="count" style="color:#b91c1c">(0)</span> <span id="userShow" style="font-size:12px"></span></h3><div id="cartItems" style="font-size:14px;color:#666">Pehle login karo</div><div id="orderForm" style="display:none;margin-top:12px"><textarea id="cAddr" class="input" placeholder="Pura Address *"></textarea><button class="btn-loc" onclick="getLocation()">📍 Live Location Lo</button><p id="locStatus" style="font-size:12px;color:green"></p><input id="cLatLng" class="input" readonly placeholder="Location auto" style="background:#f9f9f9;font-size:12px"><div style="background:#fff7ed;padding:10px;border-radius:10px;margin:8px 0;border:1px solid #fed7aa">Total: <b id="totalAmt">₹0</b></div><button class="btn-main" onclick="payAndOrder()">💳 UPI Pay & Order</button><button class="btn-main" style="background:#16a34a" onclick="placeOrderWithoutPay()">📦 Cash on Delivery</button></div></div><script>const firebaseConfig={apiKey:"AIzaSyDLWArfHEBERO2ehyhApk_zE0kWeM2tow8",authDomain:"shri-bhog.firebaseapp.com",projectId:"shri-bhog",storageBucket:"shri-bhog.firebasestorage.app",messagingSenderId:"246826560255",appId:"1:246826560255:web:d1d409cf6d9d0ea854faca"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();const UPI_ID="rohitpnd23-6@okaxis";let loggedUser=null,cart=[],customerLocation=null;const defaultItems=[{name:"Chole Bhature",price:120,img:"https://images.unsplash.com/photo-1606491956689-2ea866880c84?w=400"},{name:"Rajma Chawal",price:100,img:"https://images.unsplash.com/photo-1585937421612-70a008356fbe?w=400"},{name:"Veg Thali",price:180,img:"https://images.unsplash.com/photo-1546833999-b9f581a1996d?w=400"},{name:"Paneer Thali",price:220,img:"https://images.unsplash.com/photo-1565557623262-b51c2513a641?w=400"},{name:"Dal Bafla",price:150,img:"https://images.unsplash.com/photo-1595755433128-d388cc074a4b?w=400"},{name:"Litti Chokha",price:130,img:"https://images.unsplash.com/photo-1505253758473-96b7015fcd40?w=400"}];function doLogin(){const n=document.getElementById('lName').value.trim(),p=document.getElementById('lPhone').value.trim();if(!n||p.length!=10){alert("Naam + 10 digit mobile");return;}loggedUser={name:n,phone:p};document.getElementById('userShow').innerText=" - "+n;document.getElementById('loginBox').style.display='none';renderMenu();}function renderMenu(){db.collection("menu").get().then(snap=>{let items=defaultItems;if(!snap.empty){items=[];snap.forEach(d=>items.push(d.data()));}window._items=items;document.getElementById('menu').innerHTML=items.map((it,i)=>`<div class="card"><img src="${it.img}"><h3>${it.name}</h3><p>₹${it.price}</p><button onclick="addToCart(${i})">+ Add</button></div>`).join('');}).catch(()=>{window._items=defaultItems;document.getElementById('menu').innerHTML=defaultItems.map((it,i)=>`<div class="card"><img src="${it.img}"><h3>${it.name}</h3><p>₹${it.price}</p><button onclick="addToCart(${i})">+ Add</button></div>`).join('');});}function addToCart(i){if(!loggedUser){alert("Login karo");return;}cart.push(window._items[i]);updateCart();}function updateCart(){document.getElementById('count').innerText=`(${cart.length})`;if(cart.length==0){document.getElementById('cartItems').innerHTML="Cart khali";document.getElementById('orderForm').style.display='none';return;}document.getElementById('orderForm').style.display='block';let t=0,h="";cart.forEach((c,idx)=>{t+=c.price;h+=`<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed #eee"><span>${c.name}</span><span>₹${c.price} <span onclick="removeItem(${idx})" style="color:red">✕</span></span></div>`;});document.getElementById('cartItems').innerHTML=h;document.getElementById('totalAmt').innerText="₹"+t;}function removeItem(i){cart.splice(i,1);updateCart();}function getLocation(){const s=document.getElementById('locStatus');s.innerText="Location...";navigator.geolocation.getCurrentPosition(p=>{customerLocation={lat:p.coords.latitude,lng:p.coords.longitude};document.getElementById('cLatLng').value=customerLocation.lat+","+customerLocation.lng;s.innerHTML=`✅ Mil gaya! <a href="https://maps.google.com/?q=${customerLocation.lat},${customerLocation.lng}" target="_blank">Map</a>`;},e=>s.innerText=e.message,{enableHighAccuracy:true});}function getTotal(){return cart.reduce((a,b)=>a+b.price,0);}async function saveOrder(m){const addr=document.getElementById('cAddr').value.trim();if(!addr||!loggedUser){alert("Address + Login");return false;}const d={customerName:loggedUser.name,phone:loggedUser.phone,address:addr,locationString:document.getElementById('cLatLng').value,location:customerLocation||null,items:cart,totalAmount:getTotal(),paymentMode:m,upiId:UPI_ID,status:m==="UPI"?"Paid-Initiated":"COD-Pending",createdAt:firebase.firestore.FieldValue.serverTimestamp(),mapsLink:customerLocation?`https://maps.google.com/?q=${customerLocation.lat},${customerLocation.lng}`:null};try{const r=await db.collection("orders").add(d);return r.id;}catch(e){alert(e.message);return false;}}async function payAndOrder(){const id=await saveOrder("UPI");if(!id)return;window.location.href=`upi://pay?pa=${UPI_ID}&pn=ShriBhog&am=${getTotal()}&cu=INR&tn=Order ${id}`;setTimeout(()=>{if(confirm("Payment ho gaya?")){alert("Thanks! ID:"+id);cart=[];updateCart();}},2500);}async function placeOrderWithoutPay(){const id=await saveOrder("COD");if(id){alert("Order Confirm! ID:"+id);cart=[];updateCart();}}renderMenu();</script></body></html>
