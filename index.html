<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShriBhog</title>
<style>
body{font-family:sans-serif;background:#fff7ed;margin:0}
header{background:#ff6b00;color:white;padding:15px;display:flex;justify-content:space-between;align-items:center}
.btn{padding:8px 14px;border:none;border-radius:8px;cursor:pointer}
.tabs{display:flex;gap:8px;padding:10px}
.tab{padding:10px 15px;background:#ffe4cc;border-radius:20px;cursor:pointer}
.tab.active{background:#ff6b00;color:white}
.card{background:white;margin:10px;padding:12px;border-radius:12px;box-shadow:0 2px 8px #0001;display:flex;gap:12px}
.card img{width:80px;height:80px;object-fit:cover;border-radius:10px}
#addBox{background:white;margin:10px;padding:15px;border-radius:12px;display:none}
input{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:8px}
</style>
</head>
<body>
<header>
<div><b>ShriBhog</b></div>
<div>
<button class="btn" style="background:#fff;color:#ff6b00" onclick="if(confirm('Sab data delete karna hai?')){localStorage.clear();location.reload()}">🗑️ Reset</button>
</div>
</header>

<div class="tabs">
<div class="tab active" onclick="switchRole('customer',this)">Customer</div>
<div class="tab" onclick="switchRole('owner',this)">Shop Owner</div>
<div class="tab" onclick="switchRole('admin',this)">Admin Rohit</div>
</div>

<div id="addBox">
<h3>Dish Add Karo</h3>
<input id="dName" placeholder="Dish ka naam - ex: Panir Masala">
<input id="dPrice" type="number" placeholder="Price - ex: 100">
<input id="dImg" type="file" accept="image/*">
<button class="btn" style="background:#ff6b00;color:white;width:100%;margin-top:8px" onclick="addDish()">Add Dish</button>
</div>

<div id="list"></div>

<script>
// Auto clear if?clear in url
if(location.search.includes('clear')){localStorage.clear();alert('Data clear ho gaya!');location.href=location.pathname}

let dishes = JSON.parse(localStorage.getItem('shri_dishes')||'[]');
let role = 'customer';

function save(){localStorage.setItem('shri_dishes',JSON.stringify(dishes))}

function switchRole(r,el){
role=r;
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
el.classList.add('active');
document.getElementById('addBox').style.display = (r==='owner')?'block':'none';
render();
}

function addDish(){
let name=document.getElementById('dName').value.trim();
let price=document.getElementById('dPrice').value.trim();
let file=document.getElementById('dImg').files[0];
if(!name||!price){alert('Naam aur Price likho');return;}
if(!file){alert('Photo chuno');return;}

let reader=new FileReader();
reader.onload=function(e){
// Compress image to small size
let img=new Image();
img.onload=function(){
let canvas=document.createElement('canvas');
let max=300;
let w=img.width,h=img.height;
if(w>max||h>max){if(w>h){h=h*max/w;w=max}else{w=w*max/h;h=max}}
canvas.width=w;canvas.height=h;
canvas.getContext('2d').drawImage(img,0,0,w,h);
let small=canvas.toDataURL('image/jpeg',0.6);
dishes.push({id:Date.now(),name,price,img:small,status:'pending'});
save();render();
document.getElementById('dName').value='';document.getElementById('dPrice').value='';document.getElementById('dImg').value='';
alert('Add ho gaya! Admin se Approve karwao');
}
img.src=e.target.result;
}
reader.readAsDataURL(file);
}

function approve(id){let d=dishes.find(x=>x.id===id);if(d){d.status='approved';save();render()}}
function reject(id){dishes=dishes.filter(x=>x.id!==id);save();render()}

function render(){
let div=document.getElementById('list');
div.innerHTML='';
let show = role==='customer'? dishes.filter(d=>d.status==='approved') : dishes;
if(show.length===0){div.innerHTML='<p style="text-align:center;padding:20px">Koi dish nahi hai</p>';return;}
show.forEach(d=>{
let action='';
if(role==='admin'&&d.status==='pending'){action=`<div style="margin-top:6px"><button class="btn" style="background:#22c55e;color:white" onclick="approve(${d.id})">✅ Approve</button> <button class="btn" style="background:#ef4444;color:white" onclick="reject(${d.id})">❌ Reject</button></div>`}
if(role==='owner'){action=`<div style="margin-top:6px;font-size:12px;color:${d.status==='approved'?'green':'orange'}">Status: ${d.status}</div>`}
div.innerHTML+=`<div class="card"><img src="${d.img}"><div><b>${d.name}</b><br>₹${d.price}${action}</div></div>`;
})
}
render();
</script>
</body>
</html>
