<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShriBhog</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, updateDoc, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "PASTE_YOUR_API_KEY",
  authDomain: "PASTE_YOUR_AUTH_DOMAIN",
  projectId: "PASTE_YOUR_PROJECT_ID",
  storageBucket: "PASTE_YOUR_STORAGE_BUCKET",
  messagingSenderId: "PASTE_YOUR_SENDER_ID",
  appId: "PASTE_YOUR_APP_ID"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const dishesRef = collection(db, "dishes");
window.dbTools = { db, dishesRef, addDoc, onSnapshot, updateDoc, doc, deleteDoc };
</script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:'Segoe UI',sans-serif;background:#fff6ec}
.topbar{background:#ffe0b2;padding:15px 20px;display:flex;justify-content:space-between}
.brand{font-weight:800;color:#e65100;font-size:22px}
.container{max-width:1100px;margin:20px auto;padding:0 15px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{background:white;border-radius:16px;padding:18px;box-shadow:0 4px 20px #0001}
.btn{background:#ff6a00;color:white;border:none;padding:10px 16px;border-radius:10px;font-weight:600;cursor:pointer}
.btn-green{background:#2e7d32}.btn-red{background:#c62828}
.dish{border:1px solid #eee;border-radius:12px;padding:10px;margin:8px 0;display:flex;gap:10px}
.dish img{width:70px;height:70px;object-fit:cover;border-radius:10px}
.loginBox{max-width:380px;margin:80px auto;background:white;padding:25px;border-radius:16px;box-shadow:0 8px 30px #0002;text-align:center}
@media(max-width:700px){.container{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="loginBox" class="loginBox">
<div class="brand">ShriBhog</div><br>
<input id="u" placeholder="username"><br><br>
<input id="p" type="password" placeholder="password"><br><br>
<button class="btn" onclick="login()" style="width:100%">Login</button>
<small><br>joramandir/jora123 = Shop<br>admin/admin123 = Owner<br>raju/raju123 = Delivery Boy</small>
</div>

<div id="mainBox" style="display:none">
<div class="topbar"><div class="brand"><span id="who"></span> - <span id="role"></span></div><button class="btn btn-red" onclick="location.reload()">Logout</button></div>

<div class="container">
<!-- SHOP WALA CARD -->
<div class="card" id="addCard">
<h3 style="color:#e65100">Add New Dish (Shop)</h3>
<input id="dname" placeholder="Dish Name"><br><br>
<input id="dprice" type="number" placeholder="Price ₹"><br><br>
<input type="file" id="dimg" accept="image/*"><br><br>
<button class="btn" onclick="addDish()" style="width:100%">Submit for Approval</button>
<p id="status" style="color:green"></p>
</div>

<div>
<div class="card" id="pendingCard"><h3>Pending for Approval</h3><div id="pendingList"></div></div>
<div class="card" id="approvedCard" style="margin-top:15px"><h3 id="approvedTitle">Approved Dishes</h3><div id="approvedList"></div></div>
</div>
</div>
</div>

<script>
let currentUser=null,currentRole=null;
function login(){
 const u=document.getElementById('u').value.trim();
 const p=document.getElementById('p').value.trim();
 const users={joramandir:{pass:'jora123',role:'SHOP'},admin:{pass:'admin123',role:'ADMIN'},raju:{pass:'raju123',role:'DELIVERY'}};
 if(users[u] && users[u].pass==p){
   currentUser=u; currentRole=users[u].role;
   document.getElementById('loginBox').style.display='none';
   document.getElementById('mainBox').style.display='block';
   document.getElementById('who').innerText=u;
   document.getElementById('role').innerText=currentRole;

   // ROLE WISE HIDE/SHOW
   if(currentRole==='ADMIN'){
     document.getElementById('addCard').style.display='none'; // Admin add nahi karega
   }
   if(currentRole==='DELIVERY'){
     document.getElementById('addCard').style.display='none'; // Delivery add nahi karega
     document.getElementById('pendingCard').style.display='none'; // Pending nahi dekhega
     document.getElementById('approvedTitle').innerText='Orders for Delivery';
   }
   if(currentRole==='SHOP'){
     // Shop wala Approve nahi kar sakta, isliye button hide hoga listen me
   }
   listenDishes();
 } else alert('Wrong login');
}

function compressImage(file){
 return new Promise(res=>{
  const img=new Image(); img.onload=()=>{
   const c=document.createElement('canvas'); const max=400; let w=img.width,h=img.height;
   if(w>h){if(w>max){h*=max/w;w=max}} else {if(h>max){w*=max/h;h=max}}
   c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',0.6));
  }; img.src=URL.createObjectURL(file);
 });
}

async function addDish(){
 if(currentRole!=='SHOP') return alert('Only Shop can add');
 const name=document.getElementById('dname').value;
 const price=Number(document.getElementById('dprice').value);
 const file=document.getElementById('dimg').files[0];
 if(!name||!price) return alert('Name Price bharo');
 document.getElementById('status').innerText='Uploading...';
 let imgData=''; if(file) imgData=await compressImage(file);
 const {addDoc,dishesRef}=window.dbTools;
 await addDoc(dishesRef,{name,price,img:imgData,status:'pending',seller:currentUser,created:Date.now()});
 document.getElementById('status').innerText='Sent for Approval!';
 document.getElementById('dname').value='';
}

function listenDishes(){
 const {onSnapshot,dishesRef}=window.dbTools;
 onSnapshot(dishesRef,(snap)=>{
  const p=document.getElementById('pendingList'); const a=document.getElementById('approvedList'); p.innerHTML='';a.innerHTML='';
  snap.forEach(d=>{
   const data=d.data();const id=d.id;
   const isAdmin=currentRole==='ADMIN';
   const html=`<div class="dish"><img src="${data.img||'https://via.placeholder.com/70'}"><div style="flex:1"><b>${data.name}</b><br>₹${data.price}<br><small>${data.seller} - ${data.status}</small></div><div>${isAdmin && data.status==='pending'?`<button class="btn btn-green" onclick="approveDish('${id}')">Approve</button> <button class="btn btn-red" onclick="deleteDish('${id}')">Reject</button>`:''} ${currentRole==='DELIVERY'&&data.status==='approved'?`<button class="btn btn-green">Deliver</button>`:''}</div></div>`;
   if(data.status==='pending'){p.innerHTML+=html;} else {a.innerHTML+=html;}
  });
 });
}
window.approveDish=async(id)=>{const{updateDoc,doc,db}=window.dbTools;await updateDoc(doc(db,'dishes',id),{status:'approved'})}
window.deleteDish=async(id)=>{if(confirm('Reject/Delete?')){const{deleteDoc,doc,db}=window.dbTools;await deleteDoc(doc(db,'dishes',id))}}
</script>
</body>
</html>
