<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ShriBhog - Jora Mandir LIVE</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#fffbeb;color:#1f2937;min-height:100vh}
.top{background:#111827;color:#fff;padding:14px 4%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}
.loginBox{max-width:380px;margin:60px auto;background:#fff;padding:24px;border-radius:20px;box-shadow:0 15px 40px rgba(0,0,0,.15);border:2px solid #facc15;text-align:center}
.input{width:100%;padding:12px;border-radius:12px;border:1.5px solid #fde68a;background:#fefce8;margin:7px 0;outline:none;font-size:14px}
.btn{padding:12px 16px;border-radius:12px;border:none;font-weight:800;cursor:pointer;font-size:13px}
.btn-red{background:#b91c1c;color:#fff;width:100%}.btn-green{background:#16a34a;color:#fff;width:100%}.btn-yellow{background:#fef9c3;border:1.5px solid #facc15;flex:1}
.tabs{display:flex;gap:8px;padding:12px 4%;background:#fff7d6;position:sticky;top:52px;z-index:10}
.card{background:#fff;border-radius:16px;padding:14px;margin:12px 4%;box-shadow:0 4px 14px rgba(0,0,0,.06);border:1px solid #fef3c7}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px 4%}
.dish{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.08);border:1px solid #fff7d6;display:flex;flex-direction:column}
.dish img{width:100%;height:140px;object-fit:cover;background:#fef3c7;display:block}
.dish-body{padding:10px;flex:1;display:flex;flex-direction:column}
.price{color:#b91c1c;font-weight:800;font-size:15px}
.delt{margin-top:8px;background:#fee2e2;border:none;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:700}
</style>
</head>
<body>
<div class="top"><b>ShriBhog - Jora Mandir</b><button id="logoutBtn" onclick="logout()" style="display:none;background:#ffffff22;color:#fff;border:1px solid #ffffff44;padding:6px 12px;border-radius:20px;font-size:11px;cursor:pointer">Logout</button></div>
<div id="loginDiv" class="loginBox">
<h2 style="color:#7f1d1d;margin-bottom:6px">Jai Shri Ram 🙏</h2>
<p style="font-size:12px;color:#555;line-height:1.6;margin-bottom:12px">Bhabhi: <b>joramandir / jora123</b><br>Admin: <b>admin / admin123</b><br>Raju: <b>raju / raju123</b></p>
<input id="loginId" class="input" placeholder="Login ID" value="joramandir">
<input id="password" type="password" class="input" placeholder="Password" value="jora123">
<button onclick="login()" class="btn btn-red" style="margin-top:8px">Login Karo →</button>
<div id="msg" style="margin-top:12px;font-size:12px"></div>
</div>
<div id="mainDiv" style="display:none">
<div class="tabs"><button class="btn btn-yellow" onclick="showTab('dishes')">🍛 Dishes</button><button class="btn btn-yellow" onclick="showTab('add')">➕ Add</button><button class="btn btn-yellow" onclick="showTab('orders')">📦 Orders</button></div>
<div id="addDiv" class="card" style="display:none">
<h3 style="color:#7f1d1d">Naya Bhog Add Karo</h3>
<input id="dishName" class="input" placeholder="Dish Name - ex: Panir Kadahi">
<input id="dishPrice" type="number" class="input" placeholder="Price - ex: 210">
<input id="dishImg" class="input" placeholder="Image URL - Google se copy karo (khali chhodo to auto)">
<input type="file" id="dishFile" accept="image/*" class="input" style="background:#fff">
<textarea id="dishDesc" class="input" placeholder="Description" style="height:60px"></textarea>
<button onclick="saveDish()" class="btn btn-green">💾 Save Dish</button>
<div id="addMsg" style="font-size:12px;margin-top:8px"></div>
</div>
<div id="dishesDiv"><div id="dishesGrid" class="grid"></div></div>
<div id="ordersDiv" style="display:none"><div class="card" style="text-align:center"><div style="font-size:36px">📦</div><b>Abhi koi order nahi</b></div></div>
</div>
<script>
let dishes=JSON.parse(localStorage.getItem('shribhog_dishes')||'[]');
const users={
  'joramandir':{p:'jora123',n:'Jora Bhabhi'},
  'admin':{p:'admin123',n:'Admin Rohit'},
  'raju':{p:'raju123',n:'Raju Delivery'},
  'ram':{p:'ram123',n:'Ram Bhai'}, // <-- Naya
  'shyam':{p:'shyam@2026',n:'Shyam Customer'} // <-- Naya
};
let currentImgBase64='';
document.getElementById('dishFile').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=ev=>{currentImgBase64=ev.target.result;document.getElementById('addMsg').innerHTML='<span style=color:green>✓ Photo select ho gayi</span>';};r.readAsDataURL(file);});
function login(){const id=(document.getElementById('loginId').value||'').trim().toLowerCase();const pass=(document.getElementById('password').value||'').trim();const u=users[id];if(u&&u.p===pass){localStorage.setItem('shribhog_user',JSON.stringify({id,name:u.n}));document.getElementById('loginDiv').style.display='none';document.getElementById('mainDiv').style.display='block';document.getElementById('logoutBtn').style.display='block';showTab('dishes');render();}else{document.getElementById('msg').innerHTML='<b style=color:#b91c1c>❌ Galat ID</b>';}}
function showTab(t){document.getElementById('addDiv').style.display=t==='add'?'block':'none';document.getElementById('dishesDiv').style.display=t==='dishes'?'block':'none';document.getElementById('ordersDiv').style.display=t==='orders'?'block':'none';}
function saveDish(){const name=document.getElementById('dishName').value.trim();const price=parseInt(document.getElementById('dishPrice').value||'0');const url=document.getElementById('dishImg').value.trim();if(!name||!price){document.getElementById('addMsg').innerHTML='<span style=color:red>Naam aur Price likho</span>';return;}let finalImg='';if(currentImgBase64)finalImg=currentImgBase64;else if(url&&url.startsWith('http'))finalImg=url;else finalImg=`https://picsum.photos/seed/${Date.now()}/400/300`;const nd={id:Date.now(),name,price,image:finalImg,desc:document.getElementById('dishDesc').value.trim()};dishes.unshift(nd);localStorage.setItem('shribhog_dishes',JSON.stringify(dishes));document.getElementById('dishName').value='';document.getElementById('dishPrice').value='';document.getElementById('dishImg').value='';document.getElementById('dishDesc').value='';document.getElementById('dishFile').value='';currentImgBase64='';document.getElementById('addMsg').innerHTML='<b style=color:green>✓ Save ho gaya!</b>';render();showTab('dishes');}
function render(){const g=document.getElementById('dishesGrid');if(dishes.length===0){g.innerHTML='<div class=card style=grid-column:1/-1;text-align:center;color:#888>Koi dish nahi</div>';return;}g.innerHTML=dishes.map(d=>`<div class="dish"><img src="${d.image}" onerror="this.src='https://images.unsplash.com/photo-1565557623262-b51c2513a641?w=400&h=300&fit=crop'"><div class="dish-body"><b style="font-size:13px">${d.name}</b><span style="font-size:11px;color:#666">${d.desc||''}</span><div style="display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:6px"><span class="price">₹${d.price}</span><button class="delt" onclick="delDish(${d.id})">🗑️ Delete</button></div></div></div>`).join('');}
function delDish(id){if(!confirm('Delete?'))return;dishes=dishes.filter(x=>x.id!=id);localStorage.setItem('shribhog_dishes',JSON.stringify(dishes));render();}
function logout(){localStorage.removeItem('shribhog_user');location.reload();}
window.onload=()=>{const s=localStorage.getItem('shribhog_user');if(s){document.getElementById('loginDiv').style.display='none';document.getElementById('mainDiv').style.display='block';document.getElementById('logoutBtn').style.display='block';showTab('dishes');render();}}
</script>
</body>
</html>
