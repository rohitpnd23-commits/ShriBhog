<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Shri Bhog Admin</title><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}body{background:#fff8f0}.header{background:#b91c1c;color:#fff;padding:16px;text-align:center}.card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 4px 12px rgba(0,0,0,.08);border:1px solid #fee2e2;margin-bottom:12px}.input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0}.btn-main{background:#b91c1c;color:#fff;border:none;width:100%;padding:12px;border-radius:10px;font-weight:700;cursor:pointer}.btn{padding:8px 12px;border-radius:8px;border:none;font-weight:600;margin-right:6px;cursor:pointer}.container{padding:14px;max-width:700px;margin:auto}</style></head><body><div class="header"><h1>🙏 Shri Bhog - Admin</h1></div><div class="container"><div id="loginBox" class="card"><h3>🔐 Admin Login</h3><input id="email" class="input" placeholder="admin@shribhog.com"><input id="pass" type="password" class="input" placeholder="Password"><button class="btn-main" onclick="login()">Login</button><p id="err" style="color:red;font-size:12px"></p></div><div id="panel" style="display:none"><div style="display:flex;justify-content:space-between"><h3>Orders (<span id="orderCount">0</span>)</h3><button class="btn" style="background:#111;color:#fff" onclick="logout()">Logout</button></div><div id="orders" style="margin-top:12px">Loading...</div><hr style="margin:20px 0"><div class="card"><h3>➕ Menu Add</h3><input id="mName" class="input" placeholder="Naam"><input id="mPrice" type="number" class="input" placeholder="Price"><input id="mImg" class="input" placeholder="Image URL"><button class="btn-main" onclick="addMenu()">Add</button></div></div></div><script>const firebaseConfig={apiKey:"AIzaSyDLWArfHEBERO2ehyhApk_zE0kWeM2tow8",authDomain:"shri-bhog.firebaseapp.com",projectId:"shri-bhog",storageBucket:"shri-bhog.firebasestorage.app",messagingSenderId:"246826560255",appId:"1:246826560255:web:d1d409cf6d9d0ea854faca"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore(),auth=firebase.auth();function login(){auth.signInWithEmailAndPassword(email.value,pass.value).then(()=>show()).catch(e=>err.innerText=e.message);}function logout(){auth.signOut().then(()=>location.reload());}function show(){loginBox.style.display='none';panel.style.display='block';load();}auth.onAuthStateChanged(u=>{if(u)show();});function load(){db.collection("orders").orderBy("createdAt","desc").onSnapshot(s=>{orderCount.innerText=s.size;let h="";s.forEach(doc=>{const o=doc.data();h+=`<div class="card"><b>${o.customerName} - ${o.phone}</b> ₹${o.totalAmount} ${o.paymentMode}<br><small>${o.address}</small><br>${o.mapsLink?`<a href="${o.mapsLink}" target="_blank">📍 Map Dekho</a><br>`:''}<small>${o.items.map(i=>i.name).join(', ')} | ${o.status}</small><br><div style="margin-top:8px"><button class="btn" style="background:#16a34a;color:#fff" onclick="upd('${doc.id}','Delivered')">Delivered</button><button class="btn" style="background:#2563eb;color:#fff" onclick="upd('${doc.id}','On the Way')">On Way</button><button class="btn" style="background:#ef4444;color:#fff" onclick="upd('${doc.id}','Cancelled')">Cancel</button></div></div>`;});orders.innerHTML=h||"No orders";});}function upd(id,st){db.collection("orders").doc(id).update({status:st});}function addMenu(){const n=mName.value.trim(),p=parseInt(mPrice.value),im=mImg.value.trim();if(!n||!p){alert("Naam price bharo");return;}db.collection("menu").add({name:n,price:p,img:im||"https://images.unsplash.com/photo-1546833999-b9f581a1996d?w=400",createdAt:firebase.firestore.FieldValue.serverTimestamp()}).then(()=>alert("Added"));}
</script></body></html>
