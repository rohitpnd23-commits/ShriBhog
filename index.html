<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShriBhog</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#fff;padding-bottom:85px}
.header{background:#111827;color:white;padding:18px 15px}
.tabs{background:#1f2937;display:flex;gap:8px;padding:12px 10px;overflow-x:auto;position:sticky;top:0;z-index:10}
.tab-pill{padding:10px 14px;border-radius:25px;background:#374151;color:#cbd5e1;border:none;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.tab-pill.active{background:#f97316;color:white}
.orange-bg{background:#f97316;padding:14px 10px;min-height:100vh}
.shop-title{color:white;font-size:19px;font-weight:800;margin-bottom:12px}
.add-card{background:#fffbeb;border:2px dashed #fbbf24;border-radius:18px;padding:14px}
.inp{width:100%;padding:12px;border:2px solid #fde68a;border-radius:12px;margin-bottom:10px;background:white;font-size:14px}
.btn-green{width:100%;background:#16a34a;color:white;padding:13px;border:none;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer}
.table-card{background:white;border-radius:14px;overflow:hidden;margin-top:10px}
.table-head{display:flex;background:#f8fafc;padding:10px 8px;font-weight:800;font-size:12px;border-bottom:1px solid #e5e7eb}
.col-photo{flex:0.7}.col-name{flex:1.8}.col-rate{flex:0.8;text-align:center}
.row{display:flex;align-items:center;padding:10px 8px;border-bottom:1px solid #f1f5f9;cursor:pointer}
.row img{width:45px;height:45px;border-radius:8px;object-fit:cover}
.badge{font-size:10px;padding:3px 7px;border-radius:8px;display:inline-block;font-weight:700;margin-top:3px}
.pending{background:#fef3c7;color:#92400e}.approved{background:#dcfce7;color:#166534}.ready{background:#dbeafe;color:#1e40af}.paid{background:#f3e8ff;color:#6b21a8}.delivered{background:#dcfce7;color:#065f46}.cancelled{background:#fee2e2;color:#991b1b}
.btn-small{padding:6px 10px;border:none;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;margin:2px}
.btn-approve{background:#22c55e;color:white}.btn-ready{background:#3b82f6;color:white}.btn-pick{background:#f97316;color:white}.btn-cancel{background:#ef4444;color:white}
.btn-add{background:#f97316;color:white;padding:5px 10px;border-radius:20px;border:none;font-weight:700;cursor:pointer;font-size:12px}
.cart-bar{position:fixed;bottom:0;left:0;right:0;background:#111827;color:white;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;z-index:20}
.cart-bar button{background:#f97316;color:white;border:none;padding:10px 18px;border-radius:25px;font-weight:800}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:#0009;display:none;justify-content:center;align-items:flex-end;z-index:50}
.modal.active{display:flex}
.modal-box{background:white;width:100%;max-width:500px;border-radius:20px 20px 0 0;padding:18px;max-height:92vh;overflow:auto}
.btn-loc{background:#fef3c7;border:1px solid #fbbf24;padding:9px;border-radius:10px;width:100%;margin-bottom:10px;font-weight:700;font-size:13px}
.upi-box{background:#f0fdf4;border:2px solid #22c55e;border-radius:14px;padding:12px;text-align:center;margin:10px 0}
.otp-big{background:#111827;color:#facc15;font-size:26px;font-weight:900;letter-spacing:6px;padding:10px;border-radius:10px;text-align:center;margin:10px 0}
.pulse{animation:pulse 1s infinite}@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.04)}100%{transform:scale(1)}}
/* Tracking */
.track{display:flex;justify-content:space-between;margin:15px 0;position:relative}
.track::before{content:'';position:absolute;top:14px;left:10%;right:10%;height:3px;background:#e5e7eb;z-index:0}
.track-step{flex:1;text-align:center;z-index:1}
.dot{width:28px;height:28px;border-radius:50%;background:#e5e7eb;margin:0 auto 5px;display:flex;align-items:center;justify-content:center;font-size:14px}
.dot.active{background:#22c55e;color:white}.dot.current{background:#3b82f6;color:white;animation:pulse 1s infinite}
.track-label{font-size:10px;font-weight:700}
</style>
</head>
<body>
<div class="header"><h1>ShriBhog - Reseller<br>Demo</h1></div>
<div class="tabs">
<button class="tab-pill" id="t-customer" onclick="switchRole('customer')">🛒 Customer</button>
<button class="tab-pill active" id="t-owner" onclick="switchRole('owner')">🏪 Shop Owner</button>
<button class="tab-pill" id="t-delivery" onclick="switchRole('delivery')">🛵 Delivery Boy</button>
<button class="tab-pill" id="t-admin" onclick="switchRole('admin')">👑 Admin</button>
</div>
<div class="orange-bg">
<div class="shop-title" id="panelTitle">🏪 Shop Panel</div>
<div id="ownerPanel">
<div class="add-card">
<h3>🍛 Nayi Dish</h3>
<input type="file" id="fImg" accept="image/*" class="inp">
<input type="text" id="fName" placeholder="Dish naam" class="inp">
<input type="number" id="fRate" placeholder="Rate" class="inp">
<button class="btn-green" onclick="addDish()">✅ Approval bhejo</button>
</div>
<div style="color:white;font-weight:700;margin:15px 0 8px">📋 Dishes</div><div class="table-card" id="ownerList"></div>
<div style="color:white;font-weight:700;margin:15px 0 8px">📦 Orders - Click for Detail</div><div class="table-card" id="ownerOrders"></div>
</div>
<div id="otherPanel" style="display:none"><div class="table-card" id="otherList"></div></div>
</div>
<div class="cart-bar" id="cartBar" style="display:none"><div>🛒 <span id="cartCount">0</span> | ₹<span id="cartTotal">0</span></div><button onclick="openCheckout()">Order Karo</button></div>

<!-- Checkout -->
<div class="modal" id="checkoutModal">
<div class="modal-box">
<h3>📍 Delivery + UPI</h3>
<input id="cName" class="inp" style="margin-top:10px" placeholder="Naam">
<input id="cPhone" class="inp" placeholder="Phone">
<textarea id="cAddr" class="inp" placeholder="Address"></textarea>
<button class="btn-loc" onclick="getLocation()">📍 Current Location</button>
<p id="locStatus" style="font-size:11px;color:green;margin-bottom:8px"></p>
<div id="upiSection" style="display:none">
<div class="upi-box">
<b>💳 UPI Pay First</b><br><span style="font-size:12px">UPI: <b id="upiIdText"></b></span><br><br>
<img id="qrImg" src="" style="width:170px;height:170px;border-radius:10px"><br><br>
<b>₹<span id="payAmount">0</span></b><br>
<button onclick="payUPI()" style="background:#16a34a;color:white;border:none;padding:10px 18px;border-radius:20px;font-weight:800;width:100%;margin-top:8px">📲 UPI App se Pay</button>
</div>
<label style="font-size:12px;display:flex;gap:6px;align-items:center"><input type="checkbox" id="paidCheck"> Maine Payment Kar Diya</label>
<input id="txnId" class="inp" style="margin-top:6px" placeholder="Txn ID last 4 digit">
</div>
<button class="btn-green" id="finalOrderBtn" style="display:none;margin-top:10px" onclick="confirmOrder()">✅ Confirm Order</button>
<button onclick="closeCheckout()" style="background:#eee;border:none;padding:9px;width:100%;border-radius:10px;margin-top:6px">Cancel</button>
</div>
</div>

<!-- OTP Modal -->
<div class="modal" id="otpModal">
<div class="modal-box" style="text-align:center">
<h3>✅ Order Confirmed!</h3>
<p style="font-size:13px">Order ID: <b id="showOrderId" style="color:#b91c1c"></b></p>
<p style="font-size:12px;margin:6px 0">Ye OTP Delivery Boy ko dena</p>
<div class="otp-big" id="showOtp">----</div>
<p style="font-size:11px;color:#666">My Orders pe click karke tracking dekho</p>
<button class="btn-green" style="margin-top:12px" onclick="closeOtpModal()">OK - Tracking Dekho</button>
</div>
</div>

<!-- Delivery OTP -->
<div class="modal" id="deliveryOtpModal">
<div class="modal-box">
<h3>🔐 Delivery OTP</h3>
<p id="otpCustomerInfo" style="font-size:12px;background:#fef3c7;padding:8px;border-radius:8px"></p>
<input id="inputOtp" type="number" class="inp" style="margin-top:12px;letter-spacing:8px;font-size:22px;text-align:center;font-weight:800" placeholder="1234">
<button class="btn-green" onclick="verifyDeliveryOtp()">✅ Verify Delivery</button>
<button onclick="document.getElementById('deliveryOtpModal').classList.remove('active')" style="background:#eee;border:none;padding:9px;width:100%;border-radius:10px;margin-top:6px">Cancel</button>
<p id="otpError" style="color:red;font-size:12px;margin-top:6px;display:none">❌ Galat OTP!</p>
</div>
</div>

<!-- ORDER DETAIL MODAL -->
<div class="modal" id="detailModal">
<div class="modal-box">
<div style="display:flex;justify-content:space-between;align-items:center">
<h3 id="detailId" style="color:#b91c1c">SHRI-XXXX</h3>
<button onclick="document.getElementById('detailModal').classList.remove('active')" style="background:#eee;border:none;width:30px;height:30px;border-radius:50%">✕</button>
</div>
<div id="detailContent"></div>
</div>
</div>

<script>
const UPI_ID="rohitpnd23@okaxis"; const MERCHANT_NAME="ShriBhog";
if(location.search.includes('clear')){localStorage.clear();history.replaceState(null,'',location.pathname)}
let dishes=JSON.parse(localStorage.getItem('shri_dishes_v2')||'[]');
let orders=JSON.parse(localStorage.getItem('shri_orders')||'[]');
let cart=[];let role='owner';let currentLoc="";let lastNotifiedId=Number(localStorage.getItem('last_delivery_notify')||0);
let audioCtx;let currentDeliveryOrderId=null;
if('Notification' in window && Notification.permission==='default') Notification.requestPermission();
function playTone(){try{if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();let osc=audioCtx.createOscillator(),g=audioCtx.createGain();osc.connect(g);g.connect(audioCtx.destination);osc.frequency.value=800;g.gain.value=0.5;osc.start();g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.6);osc.stop(audioCtx.currentTime+0.6);setTimeout(()=>{let o2=audioCtx.createOscillator(),g2=audioCtx.createGain();o2.connect(g2);g2.connect(audioCtx.destination);o2.frequency.value=1000;g2.gain.value=0.5;o2.start();g2.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.6);o2.stop(audioCtx.currentTime+0.6)},300);}catch(e){}if(navigator.vibrate) navigator.vibrate([300,100,300,100,500]);}
function notifyDelivery(o){if(o.id<=lastNotifiedId) return; playTone(); if('Notification' in window && Notification.permission==='granted'){new Notification('🔥 NEW PICKUP! '+o.orderId)} lastNotifiedId=o.id;localStorage.setItem('last_delivery_notify',lastNotifiedId);}
function save(){localStorage.setItem('shri_dishes_v2',JSON.stringify(dishes));localStorage.setItem('shri_orders',JSON.stringify(orders))}
function genOrderId(){let n=orders.length+1;return 'SHRI-'+String(1000+n).slice(-4)+'-'+String(Date.now()).slice(-3)}
function switchRole(r){role=r;cart=[];updateCart();document.querySelectorAll('.tab-pill').forEach(b=>b.classList.remove('active'));document.getElementById('t-'+r).classList.add('active');document.getElementById('ownerPanel').style.display=(r==='owner')?'block':'none';document.getElementById('otherPanel').style.display=(r==='owner')?'none':'block';document.getElementById('panelTitle').innerText=r==='customer'?'🛒 Customer - Order pe Click karo detail':r==='admin'?'👑 Admin - All Delivered':r==='delivery'?'🛵 Delivery':r==='owner'?'🏪 Shop Panel':'';render();}
function addDish(){let n=document.getElementById('fName').value.trim(),rt=document.getElementById('fRate').value.trim(),fi=document.getElementById('fImg').files[0];if(!n||!rt)return alert('Naam Rate bharo');if(!fi)return alert('Photo chuno');let rd=new FileReader();rd.onload=e=>{let im=new Image();im.onload=()=>{let cv=document.createElement('canvas'),mx=400,w=im.width,h=im.height;if(w>mx||h>mx){if(w>h){h=h*mx/w;w=mx}else{w=w*mx/h;h=mx}}cv.width=w;cv.height=h;cv.getContext('2d').drawImage(im,0,0,w,h);let sm=cv.toDataURL('image/jpeg',0.6);dishes.push({id:Date.now(),name:n,rate:rt,img:sm,status:'pending'});save();document.getElementById('fName').value='';document.getElementById('fRate').value='';document.getElementById('fImg').value='';render();alert('Bhej diya!');};im.src=e.target.result;};rd.readAsDataURL(fi);}
function approve(id){let d=dishes.find(x=>x.id===id);if(d){d.status='approved';save();render()}}
function removeDish(id){if(confirm('Delete?')){dishes=dishes.filter(x=>x.id!==id);save();render()}}
function addToCart(id){let d=dishes.find(x=>x.id===id);cart.push(d);updateCart();}
function updateCart(){let tot=cart.reduce((s,x)=>s+Number(x.rate),0);document.getElementById('cartCount').innerText=cart.length;document.getElementById('cartTotal').innerText=tot;document.getElementById('cartBar').style.display=(role==='customer'&&cart.length>0)?'flex':'none';}
function openCheckout(){if(cart.length===0)return;document.getElementById('checkoutModal').classList.add('active');let tot=cart.reduce((s,x)=>s+Number(x.rate),0);document.getElementById('payAmount').innerText=tot;document.getElementById('upiIdText').innerText=UPI_ID;let upiUrl=`upi://pay?pa=${UPI_ID}&pn=${encodeURIComponent(MERCHANT_NAME)}&am=${tot}&cu=INR&tn=ShriBhog`;document.getElementById('qrImg').src=`https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(upiUrl)}`;document.getElementById('qrImg').dataset.upi=upiUrl;document.getElementById('upiSection').style.display='block';document.getElementById('finalOrderBtn').style.display='block';}
function closeCheckout(){document.getElementById('checkoutModal').classList.remove('active')}
function getLocation(){let st=document.getElementById('locStatus');st.innerText='Location...';navigator.geolocation.getCurrentPosition(p=>{currentLoc=`https://www.google.com/maps?q=${p.coords.latitude},${p.coords.longitude}`;st.innerHTML=`✅ <a href="${currentLoc}" target="_blank">Map</a>`;document.getElementById('cAddr').value+=`\n📍 ${currentLoc}`;},()=>{st.innerText='Allow location';});}
function payUPI(){window.location.href=document.getElementById('qrImg').dataset.upi;}
function confirmOrder(){
let nm=document.getElementById('cName').value.trim(),ph=document.getElementById('cPhone').value.trim(),ad=document.getElementById('cAddr').value.trim(),paid=document.getElementById('paidCheck').checked,txn=document.getElementById('txnId').value.trim();
if(!nm||!ph||!ad)return alert('Details bharo');if(!paid)return alert('Payment checkbox tick karo');
let tot=cart.reduce((s,x)=>s+Number(x.rate),0);let otp=Math.floor(1000+Math.random()*9000);let oid=genOrderId();
let newOrder={id:Date.now(),orderId:oid,items:[...cart],total:tot,customer:nm,phone:ph,address:ad,location:currentLoc,txnId:txn,payment:'UPI Paid',otp:otp,status:'Paid - New',time:new Date().toLocaleString(),createdAt:Date.now()};
orders.push(newOrder);save();cart=[];updateCart();closeCheckout();
document.getElementById('showOtp').innerText=otp;document.getElementById('showOrderId').innerText=oid;
document.getElementById('otpModal').classList.add('active');render();
document.getElementById('cName').value='';document.getElementById('cPhone').value='';document.getElementById('cAddr').value='';document.getElementById('paidCheck').checked=false;document.getElementById('txnId').value='';document.getElementById('locStatus').innerText='';currentLoc='';
}
function closeOtpModal(){document.getElementById('otpModal').classList.remove('active');let last=orders[orders.length-1];if(last) openOrderDetail(last.id);}
function shopReady(id){let o=orders.find(x=>x.id===id);if(o){o.status='Ready for Pickup';o.readyAt=Date.now();save();localStorage.setItem('shri_new_pickup',JSON.stringify(o));playTone();notifyDelivery(o);render();alert('✅ Ready! '+o.orderId);}}
function pickupOrder(id){let o=orders.find(x=>x.id===id);if(o){o.status='Out for Delivery';o.pickupAt=Date.now();save();render();}}
function openOtpVerify(id){let o=orders.find(x=>x.id===id);if(!o)return;currentDeliveryOrderId=id;document.getElementById('otpCustomerInfo').innerText=`${o.orderId} - ${o.customer} | ${o.phone}\n${o.address}`;document.getElementById('inputOtp').value='';document.getElementById('otpError').style.display='none';document.getElementById('deliveryOtpModal').classList.add('active');}
function verifyDeliveryOtp(){let entered=document.getElementById('inputOtp').value.trim();let o=orders.find(x=>x.id===currentDeliveryOrderId);if(!o)return;if(entered==o.otp){o.status='Delivered';o.deliveredAt=new Date().toLocaleString();o.deliveredTime=Date.now();save();document.getElementById('deliveryOtpModal').classList.remove('active');playTone();alert('✅ Delivered! '+o.orderId);render();}else{document.getElementById('otpError').style.display='block';if(navigator.vibrate) navigator.vibrate([200,100,200]);}}
function cancelOrder(id){let o=orders.find(x=>x.id===id);if(!o)return;if(o.status!=='Paid - New'){alert('❌ Ab cancel nahi ho sakta, Shop Ready kar chuka hai');return}if(!confirm('Cancel '+o.orderId+'?\nRefund: ₹'+o.total)) return;o.status='Cancelled by Customer';o.cancelledAt=new Date().toLocaleString();save();render();alert('✅ Cancelled '+o.orderId);}
function getEta(o){
let now=Date.now();let diff=now-(o.createdAt||o.id);
if(o.status==='Delivered') return '✅ Delivered at '+o.deliveredAt;
if(o.status.includes('Cancelled')) return '❌ Cancelled';
if(o.status==='Paid - New'){let left=15-Math.floor(diff/60000); if(left<1) left=1; return `⏳ Shop prepare kar raha hai - ${left} min me Ready hoga`;}
if(o.status==='Ready for Pickup') return '🟦 Ready! Delivery boy aane wala hai - 5-10 min';
if(o.status==='Out for Delivery'){let left=15-Math.floor((now-(o.pickupAt||now))/60000); if(left<2) left=2; return `🛵 On the way - ${left} min me aayega - OTP ${o.otp} ready rakho`;}
return o.status;
}
function openOrderDetail(id){
let o=orders.find(x=>x.id===id);if(!o)return;
document.getElementById('detailId').innerText=o.orderId;
let steps=[
{label:'Paid',icon:'💳',done:true},
{label:'Ready',icon:'🍳',done:o.status!=='Paid - New'&&!o.status.includes('Cancelled'),current:o.status==='Paid - New'},
{label:'Pickup',icon:'🛵',done:o.status==='Out for Delivery'||o.status==='Delivered',current:o.status==='Ready for Pickup'},
{label:'Delivered',icon:'✅',done:o.status==='Delivered',current:o.status==='Out for Delivery'}
];
let trackHtml='<div class="track">'+steps.map(s=>`<div class="track-step"><div class="dot ${s.done?'active':''} ${s.current?'current':''}">${s.icon}</div><div class="track-label">${s.label}</div></div>`).join('')+'</div>';
let eta=getEta(o);
let html=`
<div style="background:#fef3c7;padding:10px;border-radius:10px;font-size:13px;font-weight:700">⏱️ ${eta}</div>
${trackHtml}
<div style="font-size:13px;line-height:1.6">
<b>Customer:</b> ${o.customer} (${o.phone})<br>
<b>Address:</b> ${o.address}<br>
${o.location?`<a href="${o.location}" target="_blank">🗺️ Map Dekho</a><br>`:''}
<b>Items:</b> ${o.items.map(i=>i.name+' (₹'+i.rate+')').join(', ')}<br>
<b>Total:</b> ₹${o.total} | ${o.payment} ${o.txnId?'- '+o.txnId:''}<br>
<b>OTP:</b> <span style="background:#111827;color:#facc15;padding:2px 8px;border-radius:5px;letter-spacing:3px">${o.otp}</span> (Delivery ko dena)<br>
<b>Order Time:</b> ${o.time}<br>
<b>Status:</b> <span class="badge ${o.status.includes('Cancelled')?'cancelled':o.status.includes('Delivered')?'delivered':o.status.includes('Ready')?'ready':'paid'}">${o.status}</span><br>
<b>Order ID:</b> ${o.orderId}<br>
</div>
<div style="margin-top:12px">
${o.status==='Paid - New'?`<button class="btn-small btn-cancel" onclick="cancelOrder(${o.id});document.getElementById('detailModal').classList.remove('active')">❌ Cancel Order</button>`:''}
<a href="tel:${o.phone}" style="background:#3b82f6;color:white;padding:8px 12px;border-radius:8px;text-decoration:none;font-size:12px;font-weight:700;display:inline-block;margin-left:6px">📞 Call</a>
</div>
`;
document.getElementById('detailContent').innerHTML=html;
document.getElementById('detailModal').classList.add('active');
}

function render(){
if(role==='owner'){
let box=document.getElementById('ownerList');let html='<div class="table-head"><div class="col-photo">PHOTO</div><div class="col-name">NAME</div><div class="col-rate">RATE</div></div>';
if(dishes.length===0)html+='<div style="padding:12px;text-align:center">Koi dish nahi</div>';
dishes.forEach(d=>{html+=`<div class="row"><div class="col-photo"><img src="${d.img}"></div><div class="col-name">${d.name}<br><span class="badge ${d.status}">${d.status}</span></div><div class="col-rate">₹${d.rate} <button class="btn-small" style="background:#eee" onclick="removeDish(${d.id})">🗑️</button></div></div>`});box.innerHTML=html;
let ob=document.getElementById('ownerOrders');let oh='<div class="table-head"><div class="col-name">ORDERS (ID pe click karo detail)</div><div class="col-rate">ACTION</div></div>';
if(orders.length===0)oh+='<div style="padding:12px;text-align:center">Koi order nahi</div>';
orders.slice().reverse().forEach(o=>{let act=o.status==='Paid - New'?`<button class="btn-small btn-ready pulse" onclick="shopReady(${o.id})">🍳 Ready</button>`:`<span style="font-size:10px">${o.status}</span>`;oh+=`<div class="row" onclick="openOrderDetail(${o.id})" style="${o.status.includes('Cancelled')?'background:#fee2e2':''}"><div class="col-name" style="font-size:11px"><b style="color:#b91c1c">${o.orderId}</b> - ${o.customer}<br>₹${o.total} | OTP:${o.otp} | ${getEta(o).substring(0,45)}<br><span class="badge ${o.status.includes('Cancelled')?'cancelled':o.status.includes('Delivered')?'delivered':o.status.includes('Ready')?'ready':'paid'}">${o.status}</span></div><div class="col-rate" onclick="event.stopPropagation()">${act}</div></div>`});ob.innerHTML=oh;
}else{
let box=document.getElementById('otherList');let list=role==='customer'?dishes.filter(d=>d.status==='approved'):dishes;
if(role==='customer'){
let html=`<div style="padding:10px;font-weight:800;background:#fffbeb">🍛 Menu (${list.length})</div><div class="table-head"><div class="col-photo">PHOTO</div><div class="col-name">NAME</div><div class="col-rate">ADD</div></div>`;
if(list.length===0)html+='<div style="padding:12px;text-align:center">Koi dish nahi</div>';
list.forEach(d=>{html+=`<div class="row"><div class="col-photo"><img src="${d.img}"></div><div class="col-name">${d.name}</div><div class="col-rate">₹${d.rate}<br><button class="btn-add" onclick="addToCart(${d.id})">Add</button></div></div>`});
let myOrders=orders.slice().reverse();
html+=`<div style="padding:10px;font-weight:800;background:#fffbeb;margin-top:12px">📦 Aapke Orders (Click karo detail + tracking)</div>`;
if(myOrders.length===0)html+='<div style="padding:10px;text-align:center;background:white">Koi order nahi</div>';
myOrders.forEach(o=>{
html+=`<div class="row" style="background:white;${o.status.includes('Cancelled')?'background:#fee2e2':''}" onclick="openOrderDetail(${o.id})"><div class="col-name" style="font-size:11px"><b style="color:#b91c1c">${o.orderId}</b> - ₹${o.total} - ${o.items.map(i=>i.name).join(', ')}<br><span style="font-size:10px">${getEta(o)}</span><br><span class="badge ${o.status.includes('Cancelled')?'cancelled':o.status.includes('Delivered')?'delivered':'paid'}">${o.status}</span></div><div class="col-rate" onclick="event.stopPropagation()">${o.status==='Paid - New'?`<button class="btn-small btn-cancel" onclick="cancelOrder(${o.id})">❌ Cancel</button>`:o.status}</div></div>`});
box.innerHTML=html;
}else if(role==='delivery'){
let filtered=orders.filter(o=>o.status==='Ready for Pickup'||o.status==='Out for Delivery');
let html=`<div style="padding:10px;font-weight:800;background:#fffbeb">🛵 Pickup (${filtered.length}) - Click detail</div>`;
if(filtered.length===0)html+='<div style="padding:20px;text-align:center;background:white">Koi pickup nahi</div>';
filtered.slice().reverse().forEach(o=>{
let btn=o.status==='Ready for Pickup'?`<button class="btn-small btn-pick pulse" onclick="pickupOrder(${o.id})">🛵 Pickup</button>`:o.status==='Out for Delivery'?`<button class="btn-small btn-approve pulse" onclick="openOtpVerify(${o.id})">🔐 OTP Deliver</button>`:o.status;
html+=`<div class="row" style="${o.status==='Ready for Pickup'?'background:#eff6ff;border:2px solid #3b82f6':''}" onclick="openOrderDetail(${o.id})"><div class="col-name" style="font-size:11px"><b style="color:#b91c1c">${o.orderId}</b> ${o.status==='Ready for Pickup'?'🔔 NEW':''}<br><b>${o.customer}</b> ${o.phone}<br>₹${o.total} | ${getEta(o).substring(0,40)}</div><div class="col-rate" onclick="event.stopPropagation()">${btn}</div></div>`});
box.innerHTML=html;
}else if(role==='admin'){
let delivered=orders.filter(o=>o.status==='Delivered');let cancelled=orders.filter(o=>o.status.includes('Cancelled'));
let html=`<div style="padding:10px;font-weight:800;background:#dcfce7">✅ Delivered (${delivered.length}) - Click detail</div>`;
if(delivered.length===0)html+='<div style="padding:15px;text-align:center;background:white">Koi delivered nahi</div>';
delivered.slice().reverse().forEach(o=>{html+=`<div class="row" style="background:white" onclick="openOrderDetail(${o.id})"><div class="col-name" style="font-size:11px"><b style="color:#b91c1c">${o.orderId}</b> - ${o.customer}<br>${o.items.map(i=>i.name).join(', ')}<br>${o.deliveredAt||''} - OTP ${o.otp} OK<br><span class="badge delivered">DELIVERED</span></div><div class="col-rate">₹${o.total}</div></div>`});
let totalSale=delivered.reduce((s,o)=>s+o.total,0);
html+=`<div style="background:#111827;color:white;padding:12px;text-align:center;font-weight:800;margin-top:10px;border-radius:10px">💰 Total: ₹${totalSale} | D: ${delivered.length} | C: ${cancelled.length}</div>`;
box.innerHTML=html;
}
}
}
setInterval(()=>{let all=JSON.parse(localStorage.getItem('shri_orders')||'[]');if(JSON.stringify(all)!==JSON.stringify(orders)){orders=all;render();let np=localStorage.getItem('shri_new_pickup');if(np&&role==='delivery'){let o=JSON.parse(np);if(o.id>lastNotifiedId) notifyDelivery(o);}}},2500);
window.addEventListener('storage',e=>{if(e.key==='shri_new_pickup' && role==='delivery'){let o=JSON.parse(e.newValue);notifyDelivery(o);render();}if(e.key==='shri_orders'){orders=JSON.parse(e.newValue||'[]');render();}});
render();
</script>
</body>
</html>
