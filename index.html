<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShriBhog Admin</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, updateDoc, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "PASTE_YOUR_API_KEY",
  authDomain: "PASTE_YOUR_AUTH_DOMAIN",
  projectId: "PASTE_YOUR_PROJECT_ID",
  storageBucket: "PASTE_YOUR_STORAGE_BUCKET",
  messagingSenderId: "PASTE_YOUR_SENDER_ID",
  appId: "PASTE_YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const dishesRef = collection(db, "dishes");
window.dbTools = { db, dishesRef, addDoc, onSnapshot, updateDoc, doc, deleteDoc };
</script>
<style>body{font-family:sans-serif;padding:10px;background:#fff8f0}.card{border:1px solid #ddd;padding:10px;margin:10px 0;border-radius:8px;background:white}.pending{border-left:5px solid orange}.approved{border-left:5px solid green} button{padding:6px 12px;margin:3px;cursor:pointer}</style>
</head>
<body>
<div id="loginBox">
<h2>ShriBhog Login</h2>
<input id="u" placeholder="username"><br><br>
<input id="p" type="password" placeholder="password"><br><br>
<button onclick="login()">Login</button>
<p style="font-size:12px">Seller: joramandir/jora123, raju/raju123 | Admin: admin/admin123</p>
</div>

<div id="mainBox" style="display:none">
<h3>Welcome <span id="who"></span> (<span id="role"></span>) <button onclick="location.reload()">Logout</button></h3>

<div class="card">
<h4>Add New Dish (Photo auto 100KB me compress hoga)</h4>
<input id="dname" placeholder="Dish Name e.g. Samosa"><br><br>
<input id="dprice" type="number" placeholder="Price"><br><br>
<input type="file" id="dimg" accept="image/*"><br><br>
<button onclick="addDish()">Add for Approval</button>
<p id="status"></p>
</div>

<h3>Pending Dishes (Admin hi approve karega)</h3>
<div id="pendingList"></div>

<h3>Approved Dishes (Customer ko dikh raha hai)</h3>
<div id="approvedList"></div>
</div>

<script>
let currentUser=null, isAdmin=false;
function login(){
  const u=document.getElementById('u').value.trim();
  const p=document.getElementById('p').value.trim();
  const users={joramandir:'jora123', raju:'raju123', admin:'admin123'};
  if(users[u] && users[u]==p){
    currentUser=u; isAdmin=(u==='admin');
    document.getElementById('loginBox').style.display='none';
    document.getElementById('mainBox').style.display='block';
    document.getElementById('who').innerText=u;
    document.getElementById('role').innerText=isAdmin?'ADMIN':'SELLER';
    listenDishes();
  } else alert('Wrong login');
}

function compressImage(file){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement('canvas');
      const max=400; let w=img.width, h=img.height;
      if(w>h){ if(w>max){h*=max/w; w=max} } else { if(h>max){w*=max/h; h=max} }
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      res(canvas.toDataURL('image/jpeg',0.6));
    };
    img.src=URL.createObjectURL(file);
  });
}

async function addDish(){
  const name=document.getElementById('dname').value;
  const price=Number(document.getElementById('dprice').value);
  const file=document.getElementById('dimg').files[0];
  if(!name ||!price) return alert('Name Price bharo');
  document.getElementById('status').innerText='Uploading...';
  let imgData='';
  if(file) imgData=await compressImage(file);
  const { addDoc, dishesRef } = window.dbTools;
  await addDoc(dishesRef, { name, price, img: imgData, status: isAdmin?'approved':'pending', seller: currentUser, created: Date.now() });
  document.getElementById('status').innerText='Saved as '+(isAdmin?'Approved':'Pending');
  document.getElementById('dname').value=''; document.getElementById('dprice').value='';
}

function listenDishes(){
  const { onSnapshot, dishesRef, updateDoc, doc, deleteDoc } = window.dbTools;
  onSnapshot(dishesRef, (snap)=>{
    const pending=document.getElementById('pendingList'); const approved=document.getElementById('approvedList');
    pending.innerHTML=''; approved.innerHTML='';
    snap.forEach(d=>{
      const data=d.data(); const id=d.id;
      const el=`<div class="card ${data.status}"><b>${data.name}</b> - Rs ${data.price}<br><small>Seller:${data.seller} | ${data.status}</small><br>${data.img?`<img src="${data.img}" style="width:100px;height:100px;object-fit:cover">`:''}<br>
      ${isAdmin && data.status==='pending'? `<button onclick="approveDish('${id}')">✅ Approve</button>`:''}
      ${isAdmin? `<button onclick="deleteDish('${id}')">❌ Delete</button>`:''}</div>`;
      if(data.status==='pending') pending.innerHTML+=el; else approved.innerHTML+=el;
    });
  });
}
window.approveDish=async(id)=>{ const {updateDoc, doc, db}=window.dbTools; await updateDoc(doc(db,'dishes',id), {status:'approved'}) }
window.deleteDish=async(id)=>{ if(confirm('Delete?')){ const {deleteDoc, doc, db}=window.dbTools; await deleteDoc(doc(db,'dishes',id)) } }
</script>
</body>
</html>
