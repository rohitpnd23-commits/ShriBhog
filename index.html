<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShriBhog - Jora Mandir</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#fff7ed}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:white;padding:28px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.1);width:100%;max-width:380px}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin:8px 0}
.btn{width:100%;padding:12px;background:#ea580c;color:white;border:none;border-radius:8px;font-weight:700;cursor:pointer}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:white;box-shadow:0 2px 8px rgba(0,0,0,.06);position:sticky;top:0;z-index:10}
.tabs{display:flex;gap:8px;padding:12px 16px}
.tab{padding:8px 16px;border-radius:20px;border:1px solid #fed7aa;background:white;cursor:pointer}
.tab.active{background:#ea580c;color:white;border-color:#ea580c}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;padding:16px;max-width:1100px;margin:auto}
.dish{background:white;border-radius:14px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.06)}
.dish img{width:100%;height:180px;object-fit:cover;background:#fef3c7}
.dish-body{padding:12px}
.row{display:flex;gap:8px;margin-top:10px}
.row button{flex:1;padding:8px;border-radius:8px;border:none;cursor:pointer;font-weight:600}
.edit{background:#e0f2fe;color:#0369a1}.del{background:#fee2e2;color:#991b1b}
.form-wrap{max-width:500px;margin:20px auto;background:white;padding:20px;border-radius:14px}
#preview{width:100%;height:200px;object-fit:cover;border-radius:10px;display:none;margin-top:10px;border:1px dashed #ddd}
.small{font-size:12px;color:green;display:none}
</style>
</head>
<body>
<div id="loginPage" class="login-wrap">
<div class="card">
<h2 style="text-align:center;color:#ea580c">🙏 Jai Shri Ram</h2><p style="text-align:center;margin:8px 0 16px">ShriBhog - Jora Mandir</p>
<input id="uid" placeholder="Login ID - joramandir"><input id="pwd" type="password" placeholder="Password - jora123"><button class="btn" onclick="doLogin()">Login Karo</button>
<p style="font-size:12px;margin-top:12px;color:#666">Demo: joramandir/jora123, admin/admin123, raju/raju123</p>
</div></div>

<div id="mainPage" style="display:none">
<div class="topbar"><b>ShriBhog</b><div><span id="uname"></span> <button onclick="doLogout()" style="margin-left:10px;padding:6px 10px;border-radius:6px;border:1px solid #ddd;background:white;cursor:pointer">Logout</button></div></div>
<div class="tabs"><div id="t1" class="tab active" onclick="showTab('dishes')">Dishes</div><div id="t2" class="tab" onclick="showTab('add')">+ Add</div><div id="t3" class="tab" onclick="showTab('orders')">Orders</div></div>
<div id="dishesSec" class="grid"></div>
<div id="addSec" style="display:none"><div class="form-wrap">
<h3 id="formTitle">Naya Dish Add Karo</h3>
<input id="dname" placeholder="Name - jaise Puri Sabji"><input id="dprice" type="number" placeholder="Price - 40">
<input id="durl" placeholder="Image URL (optional)">
<div style="margin:8px 0">Ya <input type="file" id="dfile" accept="image/*" onchange="handleFile(this)"></div>
<div id="fileOk" class="small">✓ Photo select ho gayi</div>
<img id="preview"><button class="btn" style="margin-top:12px" id="saveBtn" onclick="saveDish()">Save Dish</button>
<button id="cancelEdit" style="display:none;width:100%;margin-top:8px;padding:10px;border:1px solid #ddd;background:white;border-radius:8px;cursor:pointer" onclick="cancelEdit()">Cancel Edit</button>
</div></div>
<div id="ordersSec" style="display:none;padding:16px;text-align:center;color:#666">Abhi koi order nahi</div>
</div>

<script>
const users={'joramandir':{p:'jora123',n:'Jora Bhabhi'},'admin':{p:'admin123',n:'Admin'},'raju':{p:'raju123',n:'Raju'}};
let dishes=JSON.parse(localStorage.getItem('shribhog_v3')||'[]');
let currentImg=''; let editIndex=-1;

if(dishes.length===0){dishes=[{name:'Puri Sabji',price:40,img:'https://images.unsplash.com/photo-1603894584373-5ac82b2ae398?w=400'}]; saveLocal();}

function saveLocal(){localStorage.setItem('shribhog_v3',JSON.stringify(dishes));}
function doLogin(){
 let u=document.getElementById('uid').value.trim().toLowerCase();
 let p=document.getElementById('pwd').value.trim();
 if(users[u] && users[u].p===p){localStorage.setItem('sb_user',u);initApp();}else alert('Galat ID / Password');
}
function initApp(){
 let u=localStorage.getItem('sb_user'); if(!u ||!users[u]) return;
 document.getElementById('loginPage').style.display='none'; document.getElementById('mainPage').style.display='block';
 document.getElementById('uname').innerText=users[u].n; renderDishes();
}
function doLogout(){localStorage.removeItem('sb_user'); location.reload();}
function showTab(t){
 document.getElementById('dishesSec').style.display=t==='dishes'?'grid':'none';
 document.getElementById('addSec').style.display=t==='add'?'block':'none';
 document.getElementById('ordersSec').style.display=t==='orders'?'block':'none';
 document.getElementById('t1').classList.toggle('active',t==='dishes');
 document.getElementById('t2').classList.toggle('active',t==='add');
 document.getElementById('t3').classList.toggle('active',t==='orders');
}
function handleFile(inp){
 let f=inp.files[0]; if(!f) return;
 let r=new FileReader(); r.onload=e=>{
   currentImg=e.target.result;
   document.getElementById('preview').src=currentImg; document.getElementById('preview').style.display='block';
   document.getElementById('fileOk').style.display='block';
 }; r.readAsDataURL(f);
}
function saveDish(){
 let n=document.getElementById('dname').value.trim();
 let pr=document.getElementById('dprice').value.trim();
 let url=document.getElementById('durl').value.trim();
 if(!n ||!pr) return alert('Naam aur Price bhare');
 let finalImg = currentImg || url || 'https://images.unsplash.com/photo-1603894584373-5ac82b2ae398?w=400';
 if(editIndex>=0){dishes[editIndex]={name:n,price:pr,img:finalImg}; editIndex=-1;}
 else dishes.push({name:n,price:pr,img:finalImg});
 saveLocal(); resetForm(); showTab('dishes'); renderDishes();
}
function renderDishes(){
 let g=document.getElementById('dishesSec'); g.innerHTML='';
 dishes.forEach((d,i)=>{
  g.innerHTML+=`<div class="dish"><img src="${d.img}" onerror="this.src='https://images.unsplash.com/photo-1603894584373-5ac82b2ae398?w=400'"><div class="dish-body"><div style="display:flex;justify-content:space-between"><b>${d.name}</b><b style="color:#ea580c">₹${d.price}</b></div><div class="row"><button class="edit" onclick="editDish(${i})">Edit</button><button class="del" onclick="delDish(${i})">Delete</button></div></div></div>`;
 });
}
function delDish(i){if(confirm('Delete karna hai?')){dishes.splice(i,1); saveLocal(); renderDishes();}}
function editDish(i){
 editIndex=i; let d=dishes[i];
 document.getElementById('dname').value=d.name; document.getElementById('dprice').value=d.price;
 document.getElementById('durl').value=d.img.startsWith('data:')?'':d.img;
 currentImg=d.img; document.getElementById('preview').src=d.img; document.getElementById('preview').style.display='block';
 document.getElementById('formTitle').innerText='Edit Dish'; document.getElementById('saveBtn').innerText='Update Dish';
 document.getElementById('cancelEdit').style.display='block'; showTab('add');
}
function cancelEdit(){editIndex=-1; resetForm();}
function resetForm(){
 document.getElementById('dname').value=''; document.getElementById('dprice').value=''; document.getElementById('durl').value=''; document.getElementById('dfile').value='';
 currentImg=''; document.getElementById('preview').style.display='none'; document.getElementById('fileOk').style.display='none';
 document.getElementById('formTitle').innerText='Naya Dish Add Karo'; document.getElementById('saveBtn').innerText='Save Dish'; document.getElementById('cancelEdit').style.display='none';
}
if(localStorage.getItem('sb_user')) initApp();
</script>
</body>
</html>
